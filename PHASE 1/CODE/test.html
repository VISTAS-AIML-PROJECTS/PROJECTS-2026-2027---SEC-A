<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV-Based Sales Analytics Engine | Smart-Retail Shelf Monitoring &amp; Procurement</title>
  <meta name="description" content="Academic Project Review 2: Computer vision shelf monitoring, fusing edge YOLOv11 detection, Firebase real-time data sync, and Secure Manager Restock Procurement Gateway.">
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Core Design System CSS -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Real-time AI Object Detection Models (TF.js & COCO-SSD) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>

  <!-- Top App Navigation & Status Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="brand-logo-badge" aria-hidden="true">📷</div>
        <div class="brand-titles">
          <div class="brand-title-row">
            <h1 class="brand-title">CV-Based Sales Analytics Engine</h1>
            <span class="academic-badge" id="badge-review-stage">Review 2 &bull; Harish</span>
          </div>
          <p class="brand-subtitle">Computer vision and conversational AI for smart-retail shelf monitoring</p>
        </div>
      </div>

      <!-- Live Edge & Cloud Telemetry Indicators -->
      <div class="header-telemetry-pills">
        <div class="telemetry-pill" title="Edge GPU Hardware Inference with YOLOv11 TensorRT">
          <span class="pulse-indicator"></span>
          <span class="pill-text">YOLOv11 Edge:</span>
          <span class="pill-val text-cyan" id="hdr-fps">42.8 FPS</span>
        </div>

        <div class="telemetry-pill" title="Google Firebase & MCP Server Status">
          <span class="pulse-indicator"></span>
          <span class="pill-text">Firebase Sync:</span>
          <span class="pill-val">14ms RTT</span>
        </div>

        <div class="telemetry-pill" title="Active Authenticated Store Manager User ID (Click to Switch or Register)" id="hdr-user-pill" style="cursor: pointer;">
          <span class="dot-online"></span>
          <span class="pill-text">Manager:</span>
          <span class="pill-val text-purple font-mono" id="hdr-user-badge">harish_manager</span>
        </div>

        <button class="btn btn-secondary btn-sm" id="hdr-btn-sound" title="Toggle interactive audio feedback effects">
          🔊 Sound: ON
        </button>

        <button class="btn btn-purple btn-sm" id="hdr-btn-report" title="Generate printable Daily Store Audit &amp; Vision Intelligence Dossier">
          📊 Daily Report
        </button>

        <button class="btn btn-outline btn-sm" id="hdr-btn-sco" title="Open Customer Self-Checkout Terminal">
          🛒 Self-Checkout
        </button>

        <button class="btn btn-primary btn-sm" id="hdr-btn-pickup" title="Simulate a customer removing an item from the shelf">
          🛒 Simulate Pickup
        </button>

        <button class="btn btn-secondary btn-sm" id="hdr-btn-viva" title="Open the Review 2 Academic Defense &amp; Architecture Center">
          🎓 Viva Defense
        </button>
      </div>
    </div>
  </header>

  <!-- Main Navigation Tabs -->
  <nav class="app-nav-bar" aria-label="Main Navigation Tabs">
    <ul class="nav-tabs-list" role="tablist">
      <li>
        <button class="nav-tab-btn active" id="nav-tab-vision" data-tab="tab-vision" role="tab" aria-selected="true" aria-controls="tab-vision">
          <span>📹</span>
          <span>Live CCTV Video (YOLOv11)</span>
          <span class="tab-badge">4 Feeds + Live Cam</span>
        </button>
      </li>
      <li>
        <button class="nav-tab-btn" id="nav-tab-checkout" data-tab="tab-checkout" role="tab" aria-selected="false" aria-controls="tab-checkout">
          <span>🛒</span>
          <span>Smart Self-Checkout (SCO)</span>
          <span class="tab-badge" style="background: rgba(16, 185, 129, 0.2); color: #6ee7b7;">AI Cart</span>
        </button>
      </li>
      <li>
        <button class="nav-tab-btn" id="nav-tab-inventory" data-tab="tab-inventory" role="tab" aria-selected="false" aria-controls="tab-inventory">
          <span>📦</span>
          <span>Shelf Stock &amp; Sales Fusion</span>
          <span class="tab-badge" style="background: rgba(245, 158, 11, 0.2); color: #fcd34d;">1 Alert</span>
        </button>
      </li>
      <li>
        <button class="nav-tab-btn" id="nav-tab-security" data-tab="tab-security" role="tab" aria-selected="false" aria-controls="tab-security">
          <span>🚨</span>
          <span>Loss Prevention &amp; Anti-Theft</span>
          <span class="tab-badge" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Surveillance</span>
        </button>
      </li>
      <li>
        <button class="nav-tab-btn" id="nav-tab-analytics" data-tab="tab-analytics" role="tab" aria-selected="false" aria-controls="tab-analytics">
          <span>📊</span>
          <span>Store Analytics &amp; Heatmaps</span>
          <span class="tab-badge" style="background: rgba(6, 182, 212, 0.2); color: #67e8f9;">Real-Time</span>
        </button>
      </li>
      <li>
        <button class="nav-tab-btn" id="nav-tab-invoices" data-tab="tab-invoices" role="tab" aria-selected="false" aria-controls="tab-invoices">
          <span>📄</span>
          <span>Tax Invoices &amp; Procurement</span>
          <span class="tab-badge" style="background: rgba(16, 185, 129, 0.2); color: #6ee7b7;">Archive</span>
        </button>
      </li>
      <li>
        <button class="nav-tab-btn" id="nav-tab-viva" data-tab="tab-viva" role="tab" aria-selected="false" aria-controls="tab-viva">
          <span>🎓</span>
          <span>Review 2 Academic Defense</span>
          <span class="tab-badge" style="background: rgba(139, 92, 246, 0.2); color: #c4b5fd;">Architecture &amp; Viva</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Application Main Content Area -->
  <main class="app-main">
    <!-- Tab 1: Live Edge Vision Feed -->
    <section id="tab-vision" class="tab-content-panel active" role="tabpanel" aria-labelledby="nav-tab-vision">
      <div id="vision-feed-root"></div>
    </section>

    <!-- Tab 2: Smart Self-Checkout (SCO) Kiosk Terminal -->
    <section id="tab-checkout" class="tab-content-panel" role="tabpanel" aria-labelledby="nav-tab-checkout">
      <div id="checkout-root"></div>
    </section>

    <!-- Tab 3: Shelf Stock Monitor & Sales Fusion -->
    <section id="tab-inventory" class="tab-content-panel" role="tabpanel" aria-labelledby="nav-tab-inventory">
      <div id="inventory-pos-root"></div>
    </section>

    <!-- Tab 4: Loss Prevention & Anti-Theft Anomaly Surveillance -->
    <section id="tab-security" class="tab-content-panel" role="tabpanel" aria-labelledby="nav-tab-security">
      <div id="security-root"></div>
    </section>

    <!-- Tab 5: Store Analytics & Spatial Heatmaps -->
    <section id="tab-analytics" class="tab-content-panel" role="tabpanel" aria-labelledby="nav-tab-analytics">
      <div id="analytics-root"></div>
    </section>

    <!-- Tab 6: Tax Invoices & Procurement Records Archive -->
    <section id="tab-invoices" class="tab-content-panel" role="tabpanel" aria-labelledby="nav-tab-invoices">
      <div id="invoices-root"></div>
    </section>

    <!-- Tab 7: Academic Review 2 Viva Guide & Architecture -->
    <section id="tab-viva" class="tab-content-panel" role="tabpanel" aria-labelledby="nav-tab-viva">
      <div id="viva-guide-root"></div>
    </section>
  </main>

  <!-- Collapsible Edge-to-Cloud Telemetry Terminal Drawer -->
  <aside class="telemetry-drawer collapsed" id="telemetry-drawer" aria-label="Edge to Cloud Telemetry Event Stream">
    <div class="drawer-header" id="drawer-header" title="Click to expand/collapse live telemetry event logs">
      <div class="drawer-title-group">
        <span class="dot-online"></span>
        <span>EDGE-TO-CLOUD TELEMETRY PACKET STREAM</span>
        <span class="hud-tag">YOLOv11 Edge &rarr; Firebase Sync &rarr; Procurement Gateway</span>
      </div>
      <div class="drawer-toggle-icon">&and;</div>
    </div>
    <div class="drawer-body" id="drawer-log-list">
      <!-- Live logs populated dynamically -->
    </div>
  </aside>

  <!-- Local Server Protocol Helper Script -->
  <script>
    if (window.location.protocol === 'file:') {
      const banner = document.createElement('div');
      banner.id = 'file-protocol-warning-banner';
      banner.style.cssText = 'position:fixed; top:0; left:0; right:0; z-index:99999; background:linear-gradient(90deg, #d946ef, #06b6d4); color:#ffffff; font-family:"Plus Jakarta Sans", sans-serif; font-size:13px; font-weight:700; text-align:center; padding:10px 16px; box-shadow:0 4px 15px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; gap:12px;';
      banner.innerHTML = '<span>🚀 For Live Webcam &amp; Neural Detection, access via the local server:</span> <a href="http://localhost:3000" style="background:#070a12; color:#38bdf8; padding:4px 12px; border-radius:6px; text-decoration:none; border:1px solid #38bdf8;">Open http://localhost:3000</a> <button onclick="this.parentElement.remove()" style="background:transparent; border:none; color:#ffffff; font-size:16px; cursor:pointer; margin-left:10px;">&times;</button>';
      document.body.prepend(banner);
    }
  </script>

  <!-- Modular Application Logic -->
  <script type="module" src="./app.js"></script>
</body>
</html>
